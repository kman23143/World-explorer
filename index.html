<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>World Explorer v0.4</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#74d6ee;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;color:#fff;font-weight:900;text-shadow:0 2px 4px #000;z-index:5}.card{background:#071b2dcc;border:1px solid #ffffff44;border-radius:14px;padding:7px 10px}
#islandName{position:fixed;top:65px;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:12px;background:#071b2dcc;color:#fff;font-weight:900;z-index:5}
#joy{position:fixed;left:20px;bottom:96px;width:124px;height:124px;border-radius:50%;background:#ffffff16;border:2px solid #ffffff66;z-index:10}#stick{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffffff70;border:2px solid #fff}
.btn{position:fixed;border:0;border-radius:14px;color:#fff;font-weight:900;z-index:10;box-shadow:0 4px #0005}.btn:active{transform:translateY(2px)}
#attack{right:22px;bottom:35px;width:78px;height:78px;border-radius:50%;background:#efad3d;color:#241707;font-size:28px}
#interact{right:26px;bottom:128px;min-width:120px;height:46px;background:#2d9ec8;display:none}
#build{right:22px;bottom:230px;width:95px;height:42px;background:#6d55c9}
#inventory{right:22px;bottom:280px;width:95px;height:42px;background:#4d7b9c}
#islands{right:22px;bottom:330px;width:95px;height:42px;background:#3d9b72}
#panel{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(92vw,420px);background:#071b2cf2;color:#fff;border:1px solid #ffffff44;border-radius:16px;padding:12px;z-index:20;display:none;max-height:45vh;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.slot{background:#ffffff12;border:1px solid #ffffff25;border-radius:10px;padding:8px;text-align:center;font-size:11px;min-height:42px}.slot b{display:block;font-size:18px}
.buildgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.buildgrid button{padding:10px;border:0;border-radius:10px;font-weight:800}
#hotbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:5px;z-index:8}.hot{width:55px;height:52px;background:#071b2dcc;border:2px solid #ffffff44;border-radius:10px;color:#fff;text-align:center;font-size:10px}.hot b{display:block;font-size:18px}.selected{border-color:#ffd34e}
#msg{position:fixed;left:50%;bottom:185px;transform:translateX(-50%);background:#071b2ce8;color:#fff;border-radius:13px;padding:8px 13px;opacity:0;transition:.2s;z-index:15;text-align:center;font-weight:800;max-width:80%}
#start{position:fixed;inset:0;background:linear-gradient(#258db2,#071522);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;z-index:50}.startbox{max-width:360px;padding:25px}.startbox h1{font-size:36px;margin:0 0 8px}.startbox p{line-height:1.5;opacity:.88}.startbox button{padding:15px 28px;border:0;border-radius:14px;background:#efad3d;font-weight:900;font-size:17px}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="card">❤️ <span id="hp">100</span> &nbsp; 🪙 <span id="gold">0</span></div><div class="card">⭐ <span id="xp">0</span> &nbsp; 🪵 <span id="wood">0</span> 🪨 <span id="stone">0</span></div></div>
<div id="islandName">🌴 Verdant Haven</div>
<div id="joy"><div id="stick"></div></div>
<button id="attack" class="btn">⚔️</button>
<button id="interact" class="btn">INTERACT</button>
<button id="build" class="btn">🏠 BUILD</button>
<button id="inventory" class="btn">🎒 BAG</button>
<button id="islands" class="btn">🗺️ ISLANDS</button>
<div id="hotbar"></div><div id="msg"></div>
<div id="panel"></div>
<div id="start"><div class="startbox"><h1>🏴‍☠️ World Explorer</h1><p><b>v0.4 — Island Expansion</b><br>Four distinct islands • 20 creatures • gathering • inventory • hotbar • building.</p><button id="startBtn">SET SAIL</button></div></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x78d9ee);
scene.fog=new THREE.Fog(0x78d9ee,45,125);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,220);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbff5ff,0x263f35,2.6));
const sun=new THREE.DirectionalLight(0xffffff,3.2);sun.position.set(-25,40,18);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

const toon=c=>new THREE.MeshToonMaterial({color:c});
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});
function M(g,m,p=[0,0,0]){let o=new THREE.Mesh(g,m);o.position.set(...p);o.castShadow=true;o.receiveShadow=true;return o}
function clearWorld(){while(scene.children.length>2)scene.remove(scene.children[2])}

const islands=[
{name:'🌴 Verdant Haven',color:0x56aa58,sand:0xf0d58a,sky:0x78d9ee,theme:'tropical',
creatures:[['Coconut Crab','🦀',0x8d52d1,'flee'],['Jungle Boar','🐗',0x8c4b31,'flee'],['Emerald Raptor','🦖',0x3c9c50,'aggressive'],['Vine Serpent','🐍',0x4e9d58,'flee'],['Nightmare Doll','👻',0x5b2d75,'horror']]},
{name:'🌋 Emberfang',color:0x67443b,sand:0xb86f48,sky:0xe48a65,theme:'dino',
creatures:[['Rexling','🦖',0xb84835,'aggressive'],['Triceratops','🦕',0x6c8e4a,'flee'],['Ash Raptor','🦖',0x3f4b35,'aggressive'],['Lava Gecko','🦎',0xe05c32,'flee'],['Bone Tyrant','💀',0xddd1b0,'horror']]},
{name:'🌑 Dread Hollow',color:0x303843,sand:0x555d63,sky:0x303b52,theme:'horror',
creatures:[['Grave Hound','🐺',0x42454e,'aggressive'],['Ghoul Ape','👹',0x5b5666,'aggressive'],['Mimic Bat','🦇',0x292333,'flee'],['Blood Snake','🐍',0x9c2935,'aggressive'],['The Hollow Man','👤',0x17151d,'horror']]},
{name:'⚙️ Ironfang',color:0x52606b,sand:0x81766a,sky:0x637c8e,theme:'cyborg',
creatures:[['Steel Cobra','🐍',0x70818b,'aggressive'],['Cyber Raptor','🦖',0x347f91,'aggressive'],['Chrome Scorpion','🦂',0x8899a3,'flee'],['Mecha Wolf','🐺',0x566b80,'aggressive'],['Titan-01','🤖',0x9aa5ae,'horror']]}
];

let islandIndex=0, player, ship, enemies=[],resources=[],buildings=[],hp=100,gold=0,xp=0;
let inv={wood:0,stone:0,fiber:0,ore:0,food:0};let selected=0,started=false,inShip=false,moveX=0,moveY=0,lookYaw=0,lookPitch=.2;
const hotItems=[['🪵','wood'],['🪨','stone'],['🌿','fiber'],['⚙️','ore'],['🍎','food']];
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function show(t){msg.textContent=t;msg.style.opacity=1;clearTimeout(window.st);window.st=setTimeout(()=>msg.style.opacity=0,1900)}
function hud(){hp=Math.max(0,hp);document.getElementById('hp').textContent=Math.round(hp);document.getElementById('gold').textContent=gold;document.getElementById('xp').textContent=xp;document.getElementById('wood').textContent=inv.wood;document.getElementById('stone').textContent=inv.stone}
function gain(n){xp+=n;if(xp>=100){xp-=100;hp=100;show('⭐ Level up! Health restored.')}}
function makeTree(x,z){let g=new THREE.Group();g.position.set(x,.45,z);let t=M(new THREE.CylinderGeometry(.3,.45,3,8),toon(0x79502f),[0,1.5,0]);g.add(t);for(let p of [[0,3.2,0],[-.6,3.35,.1],[.6,3.3,-.1]])g.add(M(new THREE.SphereGeometry(1,8,6),toon(islands[islandIndex].theme==='horror'?0x29362e:0x2c914c),p));g.userData={type:'wood',hp:3};scene.add(g);resources.push(g)}
function makeRock(x,z){let r=M(new THREE.DodecahedronGeometry(.85),toon(islands[islandIndex].theme==='cyborg'?0x89969e:0x77736c),[x,.7,z]);r.scale.y=.7;r.userData={type:'stone',hp:3};scene.add(r);resources.push(r)}
function makeOre(x,z){let r=M(new THREE.DodecahedronGeometry(.55),toon(0x56b6d4),[x,.65,z]);r.userData={type:'ore',hp:2};scene.add(r);resources.push(r)}
function makeEnemy(data,x,z){let g=new THREE.Group();g.position.set(x,.55,z);let c=data[2];g.add(M(new THREE.SphereGeometry(.9,10,8),toon(c),[0,.8,0]));g.add(M(new THREE.SphereGeometry(.5,9,7),toon(0xdba5e5),[0,.55,.72]));for(let sx of[-.3,.3]){g.add(M(new THREE.SphereGeometry(.16,7,6),toon(0xffffff),[sx,1.12,.72]));g.add(M(new THREE.SphereGeometry(.07,7,6),toon(0x111111),[sx,1.12,.86]))}g.userData={name:data[0],emoji:data[1],hp:40,state:'idle',behaviour:data[3],home:new THREE.Vector3(x,.55,z),attackCd:0};scene.add(g);enemies.push(g)}

function makePlayer(){player=new THREE.Group();player.position.set(-11,.55,8);scene.add(player);let skin=toon(0xffc18e),blue=toon(0x2868c5),dark=toon(0x20252d);player.add(M(new THREE.CapsuleGeometry(.46,.72,5,10),blue,[0,1.05,0]));player.add(M(new THREE.SphereGeometry(.43,12,10),skin,[0,2.02,0]));player.add(M(new THREE.CylinderGeometry(.68,.52,.18,16),dark,[0,2.48,0]));player.add(M(new THREE.CylinderGeometry(.43,.49,.43,16),dark,[0,2.72,0]));player.userData.limbs=[];for(let q of[[-.58,1.25], [.58,1.25],[-.25,.5],[.25,.5]]){let g=new THREE.Group();g.position.set(q[0],q[1],0);g.add(M(new THREE.CapsuleGeometry(.13,.58,4,8),dark,[0,-.3,0]));player.add(g);player.userData.limbs.push(g)}}
function makeShip(){ship=new THREE.Group();ship.position.set(-17,.8,11);scene.add(ship);ship.add(M(new THREE.CapsuleGeometry(1.2,4.4,5,12),toon(0x63371e),[0,0,0]));ship.children[0].rotation.z=Math.PI/2;ship.children[0].scale.y=.7;ship.add(M(new THREE.BoxGeometry(4.5,.35,2.4),toon(0x9b5d2d),[0,.5,0]));ship.add(M(new THREE.CylinderGeometry(.14,.19,5.5,8),toon(0x5c381f),[0,3,0]));let s=M(new THREE.PlaneGeometry(3.3,3.7),new THREE.MeshToonMaterial({color:0xffefd0,side:THREE.DoubleSide}),[1,3.1,0]);s.rotation.y=Math.PI/2;ship.add(s)}
function buildWorld(){clearWorld();enemies=[];resources=[];buildings=[];let I=islands[islandIndex];scene.background=new THREE.Color(I.sky);scene.fog.color=new THREE.Color(I.sky);
scene.add(M(new THREE.CylinderGeometry(80,80,.7,64),mat(0x2aa7c4),[0,-1.15,0]));scene.add(M(new THREE.CylinderGeometry(31,38,1.6,48),toon(I.color),[0,-.35,0]));scene.add(M(new THREE.CylinderGeometry(31.2,32.8,.45,48),toon(I.sand),[0,.45,0]));
for(let i=0;i<9;i++)makeTree((Math.random()-.5)*45,(Math.random()-.5)*45);for(let i=0;i<7;i++)makeRock((Math.random()-.5)*45,(Math.random()-.5)*45);if(I.theme==='cyborg')for(let i=0;i<7;i++)makeOre((Math.random()-.5)*45,(Math.random()-.5)*45);
I.creatures.forEach((c,i)=>makeEnemy(c,(i%2?1:-1)*(4+i*3),(i*4-8)));
makeShip();makePlayer();document.getElementById('islandName').textContent=I.name;hud()}
function removeObject(o){scene.remove(o);resources=resources.filter(x=>x!==o)}
function gather(){let best=null,bd=3;for(let r of resources){let d=player.position.distanceTo(r.position);if(d<bd){bd=d;best=r}}if(!best){show('Walk closer to a tree, rock or ore.');return}best.userData.hp--;if(best.userData.hp>0){show('⛏️ Hit the resource again.');return}let type=best.userData.type,amount=type==='wood'?3:type==='stone'?2:2;inv[type]+=amount;gain(5);show((type==='wood'?'🪵':type==='stone'?'🪨':'⚙️')+' +'+amount+' '+type);removeObject(best);hud()}
function attack(){let best=null,bd=3.2;for(let e of enemies)if(e.visible&&e.userData.hp>0){let d=player.position.distanceTo(e.position);if(d<bd){bd=d;best=e}}if(!best){gather();return}best.userData.state='attack';best.userData.hp-=20;if(best.userData.hp<=0){best.visible=false;gold+=15;gain(20);show('💥 '+best.userData.emoji+' defeated! +15 gold')}else show('⚔️ '+best.userData.name+' is enraged!');hud()}
function build(type){if(!player||inShip)return;let cost={floor:{wood:2},wall:{wood:3},roof:{wood:3},door:{wood:4}}[type];let ok=Object.entries(cost).every(([k,v])=>inv[k]>=v);if(!ok){show('❌ Not enough wood.');return}Object.entries(cost).forEach(([k,v])=>inv[k]-=v);let p=player.position.clone();p.y=.6;if(type==='floor'){let o=M(new THREE.BoxGeometry(3,.18,3),toon(0x9b6338),p);buildings.push(o)}else if(type==='wall'){let o=M(new THREE.BoxGeometry(3,2.5,.18),toon(0x9b6338),[p.x,p.y+1.25,p.z-1.4]);buildings.push(o)}else if(type==='roof'){let o=M(new THREE.BoxGeometry(3.4,.2,3.4),toon(0x7a4630),[p.x,p.y+2.7,p.z]);o.rotation.x=.12;buildings.push(o)}else{let o=M(new THREE.BoxGeometry(.9,2.2,.18),toon(0x63371e),[p.x,p.y+1.1,p.z-1.42]);buildings.push(o)}show('🏠 Built '+type);hud();document.getElementById('panel').style.display='none'}
function inventoryPanel(){panel.innerHTML='<b>🎒 Inventory</b><p class="small">Materials and loot carried by your pirate.</p><div class="grid">'+[['🪵','Wood','wood'],['🪨','Stone','stone'],['🌿','Fiber','fiber'],['⚙️','Ore','ore'],['🍎','Food','food'],['🪙','Gold','gold']].map(x=>`<div class="slot"><b>${x[0]}</b>${x[1]}<br>${x[2]==='gold'?gold:inv[x[2]]}</div>`).join('')+'</div><br><button class="btn" style="position:static;background:#4d7b9c;width:100%" onclick="panel.style.display=\'none\'">CLOSE</button>';panel.style.display='block'}
function buildPanel(){panel.innerHTML='<b>🏠 Build Menu</b><p class="small">Build close to yourself. Gather wood first.</p><div class="buildgrid"><button onclick="build(\'floor\')">🟫 Floor<br>2 🪵</button><button onclick="build(\'wall\')">🧱 Wall<br>3 🪵</button><button onclick="build(\'roof\')">🔺 Roof<br>3 🪵</button><button onclick="build(\'door\')">🚪 Door<br>4 🪵</button></div><br><button class="btn" style="position:static;background:#4d7b9c;width:100%" onclick="panel.style.display=\'none\'">CLOSE</button>';panel.style.display='block'}
function islandPanel(){panel.innerHTML='<b>🗺️ Islands</b><p class="small">Each island has its own creatures and resources.</p>'+islands.map((x,i)=>`<button style="width:100%;padding:10px;margin:4px 0;border:0;border-radius:10px;font-weight:900" onclick="travel(${i})">${x.name} — ${x.theme}</button>`).join('')+'<br><button class="btn" style="position:static;background:#4d7b9c;width:100%" onclick="panel.style.display=\'none\'">CLOSE</button>';panel.style.display='block'}
window.travel=i=>{islandIndex=i;inShip=false;player.visible=true;buildWorld();panel.style.display='none';show('⛵ Arrived at '+islands[i].name)}
function renderHotbar(){hotbar.innerHTML=hotItems.map((x,i)=>`<button class="hot ${i===selected?'selected':''}" onclick="selected=${i};renderHotbar()"><b>${x[0]}</b>${x[1]}<br>${inv[x[1]]}</button>`).join('')}
const panel=document.getElementById('panel'),msg=document.getElementById('msg'),hotbar=document.getElementById('hotbar');renderHotbar();

document.getElementById('inventory').onclick=inventoryPanel;document.getElementById('build').onclick=buildPanel;document.getElementById('islands').onclick=islandPanel;document.getElementById('attack').onclick=attack;
document.getElementById('interact').onclick=()=>{if(inShip){inShip=false;player.visible=true;player.position.copy(ship.position).add(new THREE.Vector3(0,0,3));show('🏝️ Back on the island.')}else{inShip=true;player.visible=false;show('⛵ You are aboard! Use the joystick to sail.')}};
const joy=document.getElementById('joy'),stick=document.getElementById('stick');let joyId=null;
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});joy.addEventListener('pointerup',e=>{if(e.pointerId===joyId){joyId=null;moveX=moveY=0;stick.style.left='35px';stick.style.top='35px'}});
function joyMove(e){let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=42,l=Math.hypot(dx,dy)||1;if(l>m){dx*=m/l;dy*=m/l}moveX=dx/m;moveY=dy/m;stick.style.left=35+dx+'px';stick.style.top=35+dy+'px'}
let lookId=null,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<165||e.clientY>innerHeight-175)return;lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;lookYaw-=(e.clientX-lastX)*.006;lookPitch-=(e.clientY-lastY)*.004;lookPitch=Math.max(-.12,Math.min(.55,lookPitch));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});

function movement(dt){let kx=(keys.d?1:0)-(keys.a?1:0),ky=(keys.s?1:0)-(keys.w?1:0),x=Math.abs(moveX)>.05?moveX:kx,y=Math.abs(moveY)>.05?moveY:ky,l=Math.hypot(x,y);if(l>1){x/=l;y/=l}let f=new THREE.Vector3(-Math.sin(lookYaw),0,-Math.cos(lookYaw)),r=new THREE.Vector3(Math.cos(lookYaw),0,-Math.sin(lookYaw)),d=f.multiplyScalar(-y).add(r.multiplyScalar(x));if(d.lengthSq()>.001){d.normalize();let obj=inShip?ship:player;obj.position.addScaledVector(d,dt*(inShip?7:5.8));obj.rotation.y=Math.atan2(d.x,d.z);if(!inShip){let t=performance.now()/120;player.userData.limbs[0].rotation.x=Math.sin(t)*.65;player.userData.limbs[1].rotation.x=-Math.sin(t)*.65;player.userData.limbs[2].rotation.x=-Math.sin(t)*.72;player.userData.limbs[3].rotation.x=Math.sin(t)*.72}}}
function ai(e,dt){if(!e.visible||inShip)return;let u=e.userData,d=e.position.distanceTo(player.position);u.attackCd-=dt;if(d<2){u.state='attack';if(u.attackCd<=0){hp-=8;u.attackCd=1.1;show('💢 '+u.name+' attacks!');hud()}}else if(u.state==='attack'&&d<10){let v=player.position.clone().sub(e.position);v.y=0;v.normalize();e.position.addScaledVector(v,dt*2)}else if(u.state==='idle'&&d<4.2){if(u.behaviour==='flee'){let v=e.position.clone().sub(player.position);v.y=0;v.normalize();e.position.addScaledVector(v,dt*2.7);u.state='flee'}else if(u.behaviour==='horror'){let v=player.position.clone().sub(e.position);v.y=0;v.normalize();e.position.addScaledVector(v,dt*1.2)} }else if(u.state==='flee'){let v=e.position.clone().sub(player.position);v.y=0;if(d>10)u.state='idle';else{v.normalize();e.position.addScaledVector(v,dt*2.2)}}}
function update(dt){if(!started)return;movement(dt);enemies.forEach(e=>ai(e,dt));if(!inShip){let near=null,bd=3.8;for(let r of resources){let d=player.position.distanceTo(r.position);if(d<bd){bd=d;near=r}}if(near){interact.textContent='⛏️ GATHER';interact.style.display='block';interact.onclick=gather}else{let d=player.position.distanceTo(ship.position);if(d<4.5){interact.textContent='⛵ BOARD SHIP';interact.style.display='block';interact.onclick=()=>{inShip=true;player.visible=false;show('⛵ Sailing!')}}else interact.style.display='none'}}else{interact.textContent='🏝️ LEAVE SHIP';interact.style.display='block';interact.onclick=()=>{inShip=false;player.visible=true;player.position.copy(ship.position).add(new THREE.Vector3(0,0,3));show('🏝️ Back on the island.')}}if(hp<=0){hp=100;gold=Math.max(0,gold-15);player.position.set(-11,.55,8);inShip=false;player.visible=true;show('☠️ Knocked out! -15 gold');hud()}let target=(inShip?ship:player).position.clone();target.y+=1.5;let dist=inShip?9:7,off=new THREE.Vector3(Math.sin(lookYaw)*dist,3+lookPitch*3,Math.cos(lookYaw)*dist);camera.position.lerp(target.clone().add(off),1-Math.pow(.001,dt));camera.lookAt(target);renderHotbar()}
let last=performance.now();function loop(now){let dt=Math.min((now-last)/1000,.05);last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('startBtn').onclick=()=>{started=true;document.getElementById('start').style.display='none';show('🏝️ Explore, gather, build and sail.');};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
buildWorld();hud();
</script></body></html>
