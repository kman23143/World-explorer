<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>World Explorer v0.3</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79d8ee;font-family:system-ui,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;color:white;font-weight:900;text-shadow:0 2px 4px #000;pointer-events:none}.card{background:#082238cc;border:2px solid #ffffff44;border-radius:15px;padding:8px 12px}
#help{position:fixed;top:68px;left:50%;transform:translateX(-50%);color:#fff;background:#082238cc;border-radius:14px;padding:8px 12px;font-size:12px;white-space:nowrap;pointer-events:none}
#joy{position:fixed;left:22px;bottom:25px;width:124px;height:124px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff66}#stick{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffffff70;border:2px solid #fff}
button{font-family:inherit}#attack{position:fixed;right:27px;bottom:40px;width:84px;height:84px;border:0;border-radius:50%;background:#efad3d;font-size:30px;font-weight:900;box-shadow:0 5px #956318}#action{position:fixed;right:28px;bottom:135px;min-width:125px;height:48px;border:0;border-radius:14px;background:#39a9d2;color:#fff;font-weight:900;display:none;box-shadow:0 4px #216b88}
#msg{position:fixed;left:50%;bottom:155px;transform:translateX(-50%);color:white;background:#082238e8;border-radius:14px;padding:9px 14px;opacity:0;transition:.2s;pointer-events:none;text-align:center;max-width:82%;font-weight:700}
#start{position:fixed;inset:0;background:linear-gradient(#2b9ec4,#071522);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}.startbox{max-width:340px;padding:28px}.startbox h1{font-size:35px;margin:0 0 8px}.startbox p{opacity:.86;line-height:1.5}.startbox button{padding:15px 27px;border:0;border-radius:14px;background:#efad3d;font-weight:900;font-size:17px}
</style></head><body>
<div id="game"></div><div id="hud"><div class="card">❤️ <span id="hp">100</span></div><div class="card">🪙 <span id="gold">0</span> &nbsp; ⭐ <span id="xp">0</span></div></div>
<div id="help">Left stick: move • Drag right: camera • ⚔️ attack</div><div id="joy"><div id="stick"></div></div><button id="action">⛵ BOARD SHIP</button><button id="attack">⚔️</button><div id="msg"></div>
<div id="start"><div class="startbox"><h1>🏴‍☠️ World Explorer</h1><p><b>Anime Pirate Prototype v0.3</b><br>Animated pirate • reactive enemies • usable ship • brighter cel-shaded look.</p><button id="startBtn">SET SAIL</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x79d8ee);scene.fog=new THREE.Fog(0x79d8ee,38,100);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbff4ff,0x305d36,2.5));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-20,35,18);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const toon=c=>new THREE.MeshToonMaterial({color:c});const mesh=(g,m,p=[0,0,0])=>{let o=new THREE.Mesh(g,m);o.position.set(...p);o.castShadow=true;o.receiveShadow=true;return o};
scene.add(mesh(new THREE.CylinderGeometry(80,80,.7,64),new THREE.MeshStandardMaterial({color:0x2aa7c4}),[0,-1.15,0]));
scene.add(mesh(new THREE.CylinderGeometry(31,38,1.6,48),toon(0x58ad58),[0,-.35,0]));scene.add(mesh(new THREE.CylinderGeometry(31.2,32.8,.45,48),toon(0xf0d58a),[0,.45,0]));
function tree(x,z,s=1){let g=new THREE.Group();g.position.set(x,.55,z);g.scale.setScalar(s);g.add(mesh(new THREE.CylinderGeometry(.28,.4,2.8,8),toon(0x81502f),[0,1.4,0]));for(let p of [[0,3.15,0],[-.55,3.35,.1],[.55,3.3,-.05]])g.add(mesh(new THREE.SphereGeometry(.95,8,6),toon(0x2b8d4c),p));scene.add(g)}
[[-9,-7,1],[8,-10,1.15],[-14,4,.9],[13,5,1.05],[-4,12,.85],[11,13,.85],[-18,-1,.8]].forEach(p=>tree(...p));
for(let p of [[-3,-4,0x9a8b79],[5,7,0x7f7469],[15,-3,0x8d8173],[-11,11,0x85796b]]){let r=mesh(new THREE.DodecahedronGeometry(.8),toon(p[2]),[p[0],.65,p[1]]);r.scale.y=.7;scene.add(r)}
const ship=new THREE.Group();ship.position.set(-17,.75,11);scene.add(ship);
ship.add(mesh(new THREE.CapsuleGeometry(1.2,4.2,5,12),toon(0x6c3b20),[0,0,0]));ship.children[0].rotation.z=Math.PI/2;ship.children[0].scale.y=.7;
ship.add(mesh(new THREE.BoxGeometry(4.5,.35,2.4),toon(0x9a5d2d),[0,.5,0]));ship.add(mesh(new THREE.CylinderGeometry(.13,.19,5.5,8),toon(0x603b20),[0,3,0]));
let sail=mesh(new THREE.PlaneGeometry(3.3,3.7),new THREE.MeshToonMaterial({color:0xfff0cf,side:THREE.DoubleSide}),[.95,3.1,0]);sail.rotation.y=Math.PI/2;ship.add(sail);let flag=mesh(new THREE.PlaneGeometry(1.2,.7),toon(0xc9323c),[0,5.45,0]);flag.rotation.y=Math.PI/2;ship.add(flag);
for(let i=-2;i<=2;i++)scene.add(mesh(new THREE.BoxGeometry(2.4,.3,.65),toon(0x8f5b30),[-17+i*2.6,.55,7]));
const player=new THREE.Group();player.position.set(-13,.55,9);scene.add(player);const skin=toon(0xffc18e),blue=toon(0x2d69c4),dark=toon(0x20252d);
player.add(mesh(new THREE.CapsuleGeometry(.46,.72,5,10),blue,[0,1.05,0]));player.add(mesh(new THREE.SphereGeometry(.43,12,10),skin,[0,2.02,0]));player.add(mesh(new THREE.CylinderGeometry(.67,.52,.18,16),dark,[0,2.47,0]));player.add(mesh(new THREE.CylinderGeometry(.43,.49,.43,16),dark,[0,2.72,0]));
let limbs=[];for(let q of [[-.58,1.25,blue],[.58,1.25,blue],[-.25,.5,dark],[.25,.5,dark]]){let g=new THREE.Group();g.position.set(q[0],q[1],0);g.add(mesh(new THREE.CapsuleGeometry(.13,.58,4,8),toon(q[2].color.getHex()),[0,-.3,0]));player.add(g);limbs.push(g)}
let sword=mesh(new THREE.BoxGeometry(.11,.85,.11),toon(0xe6edf2),[.7,1.18,.28]);sword.rotation.z=-.35;player.add(sword);
function enemy(x,z){let e=new THREE.Group();e.position.set(x,.55,z);e.add(mesh(new THREE.SphereGeometry(.9,12,8),toon(0x7d4fd1),[0,.85,0]));e.children[0].scale.set(1.2,.85,1);e.add(mesh(new THREE.SphereGeometry(.52,10,8),toon(0xd9a7ef),[0,.65,.73]));for(let sx of [-.33,.33]){e.add(mesh(new THREE.SphereGeometry(.17,8,6),toon(0xffffff),[sx,1.18,.72]));e.add(mesh(new THREE.SphereGeometry(.075,8,6),toon(0x111111),[sx,1.18,.87]))}for(let sx of [-.62,.62]){let h=mesh(new THREE.ConeGeometry(.15,.55,6),toon(0xffd15a),[sx,1.72,0]);h.rotation.z=sx>0?-.45:.45;e.add(h)}e.userData={hp:50,state:'idle',home:new THREE.Vector3(x,.55,z),attackCd:0,speed:1.8};scene.add(e);return e}
const enemies=[enemy(5,2),enemy(10,-6),enemy(-4,-10),enemy(12,10)];
let hp=100,gold=0,xp=0,started=false,inShip=false,moveX=0,moveY=0,lookYaw=0,lookPitch=.2;
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const joy=document.getElementById('joy'),stick=document.getElementById('stick');let joyId=null;joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});joy.addEventListener('pointerup',e=>{if(e.pointerId===joyId){joyId=null;moveX=moveY=0;stick.style.left='35px';stick.style.top='35px'}});
function joyMove(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=42,l=Math.hypot(dx,dy)||1;if(l>m){dx*=m/l;dy*=m/l}moveX=dx/m;moveY=dy/m;stick.style.left=35+dx+'px';stick.style.top=35+dy+'px'}
let lookId=null,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<165||e.clientY>innerHeight-175)return;lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;lookYaw-=(e.clientX-lastX)*.006;lookPitch-=(e.clientY-lastY)*.004;lookPitch=Math.max(-.12,Math.min(.55,lookPitch));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});
function say(t){let e=document.getElementById('msg');e.textContent=t;e.style.opacity=1;clearTimeout(window.st);window.st=setTimeout(()=>e.style.opacity=0,1800)}function hud(){hp=Math.max(0,hp);document.getElementById('hp').textContent=Math.round(hp);document.getElementById('gold').textContent=gold;document.getElementById('xp').textContent=xp}function gain(n){xp+=n;if(xp>=100){xp-=100;hp=100;say('⭐ Level up! Full health restored.')}}
function attack(){if(!started||inShip)return;let b=null,bd=3.4;for(let e of enemies)if(e.userData.hp>0){let d=player.position.distanceTo(e.position);if(d<bd){bd=d;b=e}}if(!b){say('⚔️ No enemy in range');return}b.userData.state='attack';b.userData.hp-=25;if(b.userData.hp<=0){b.visible=false;gold+=20;gain(25);say('💥 Enemy defeated! +20 gold')}else say('⚔️ Hit! It is angry now!');hud()}document.getElementById('attack').onclick=attack;
const action=document.getElementById('action');action.onclick=()=>{if(!inShip){inShip=true;player.visible=false;say('⛵ You are aboard! Sail around the island.')}else{inShip=false;player.visible=true;player.position.copy(ship.position).add(new THREE.Vector3(0,0,3));say('🏝️ Back on the island.')}action.style.display='none'};
function movement(dt){let kx=(keys.d?1:0)-(keys.a?1:0),ky=(keys.s?1:0)-(keys.w?1:0),x=Math.abs(moveX)>.05?moveX:kx,y=Math.abs(moveY)>.05?moveY:ky,l=Math.hypot(x,y);if(l>1){x/=l;y/=l}let f=new THREE.Vector3(-Math.sin(lookYaw),0,-Math.cos(lookYaw)),r=new THREE.Vector3(Math.cos(lookYaw),0,-Math.sin(lookYaw)),d=f.multiplyScalar(-y).add(r.multiplyScalar(x));if(d.lengthSq()>.001){d.normalize();if(inShip){ship.position.addScaledVector(d,dt*7);ship.rotation.y=Math.atan2(d.x,d.z);ship.position.x=THREE.MathUtils.clamp(ship.position.x,-45,45);ship.position.z=THREE.MathUtils.clamp(ship.position.z,-45,45)}else{player.position.addScaledVector(d,dt*5.8);player.rotation.y=Math.atan2(d.x,d.z);let t=performance.now()/120;limbs[0].rotation.x=Math.sin(t)*.65;limbs[1].rotation.x=-Math.sin(t)*.65;limbs[2].rotation.x=-Math.sin(t)*.72;limbs[3].rotation.x=Math.sin(t)*.72}}else limbs.forEach(g=>g.rotation.x*=.82)}
function ai(e,dt){if(!e.visible||inShip)return;let u=e.userData,d=e.position.distanceTo(player.position);u.attackCd-=dt;if(d<2){u.state='attack';if(u.attackCd<=0){hp-=8;u.attackCd=1.1;say('💢 The creature attacks!');hud()}}else if(u.state==='attack'&&d<9){let v=player.position.clone().sub(e.position);v.y=0;v.normalize();e.position.addScaledVector(v,dt*u.speed)}else if(u.state==='idle'&&d<4.5){let v=e.position.clone().sub(player.position);v.y=0;v.normalize();e.position.addScaledVector(v,dt*2.7);u.state='flee'}else if(u.state==='flee'){let v=e.position.clone().sub(player.position);v.y=0;if(d>10)u.state='idle';else{v.normalize();e.position.addScaledVector(v,dt*2.2)}}else{let v=u.home.clone().sub(e.position);v.y=0;if(v.length()>1){v.normalize();e.position.addScaledVector(v,dt*.5)}}}
function update(dt){if(!started)return;movement(dt);enemies.forEach(e=>ai(e,dt));let near=(inShip?ship.position:player.position).distanceTo(ship.position)<4.2;action.style.display=(!inShip&&near)||inShip?'block':'none';action.textContent=inShip?'🏝️ LEAVE SHIP':'⛵ BOARD SHIP';if(!inShip&&hp<=0){hp=100;gold=Math.max(0,gold-15);player.position.set(-13,.55,9);say('☠️ Knocked out! -15 gold');hud()}let target=(inShip?ship.position:player.position).clone();target.y+=1.5;let dist=inShip?9:7,off=new THREE.Vector3(Math.sin(lookYaw)*dist,3.2+lookPitch*3,Math.cos(lookYaw)*dist);camera.position.lerp(target.clone().add(off),1-Math.pow(.001,dt));camera.lookAt(target)}
let last=performance.now();function loop(now){let dt=Math.min((now-last)/1000,.05);last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('startBtn').onclick=()=>{started=true;document.getElementById('start').style.display='none';say('🏝️ Explore the island. The creatures have minds of their own.');};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});hud();
</script></body></html>
